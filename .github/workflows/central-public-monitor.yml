name: CI Detective Central Public Monitor

on:
  workflow_dispatch:
  pull_request:
  schedule:
    - cron: '*/15 * * * *'

jobs:
  monitor:
    runs-on: ubuntu-latest
    environment: NVIDIA-CENTRAL
    permissions:
      contents: read
    env:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      GH_TOKEN: ${{ github.token }}
      TARGET_REPO: SamoTech/RepoSource-Registry
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Poll latest public failure
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${TARGET_REPO}/actions/runs?status=failure&per_page=5" > runs.json
          run_id="$(jq -r '.workflow_runs[0].id // empty' runs.json)"
          test -n "$run_id"
          gh api "repos/${TARGET_REPO}/actions/runs/${run_id}/jobs?per_page=100" > jobs.json
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          from src.ci_detective import classify_failure
          repo=os.environ['TARGET_REPO']
          run=json.loads(Path('runs.json').read_text())['workflow_runs'][0]
          jobs=json.loads(Path('jobs.json').read_text())['jobs']
          out=['## CI Detective — Central Public Repository Report','',f"**Repository:** `{repo}`  ",f"**Run:** [{run['id']}]({run['html_url']})  ",f"**Commit:** `{run.get('head_sha','')}`",'']
          all_items=[]
          for job in jobs:
              if job.get('conclusion')!='failure': continue
              r=subprocess.run(['gh','api',f"repos/{repo}/actions/jobs/{job['id']}/logs"],capture_output=True,text=True,timeout=60)
              d=classify_failure(r.stdout if r.returncode==0 else '')
              item={'job':job.get('name','unknown'),'job_id':job['id'],'category':d.category,'summary':d.summary,'confidence':d.confidence,'evidence':d.evidence,'failing_tests':d.failing_tests,'traceback_files':d.traceback_files}
              all_items.append(item)
              out += [f"### Failed Job: `{item['job']}`",'',f"**Category:** `{d.category}`  ",f"**Confidence:** **{d.confidence.upper()}**",'',d.summary]
              if d.evidence: out += ['', '#### Evidence']+[f'- {x}' for x in d.evidence]
          payload={'schema_version':'1.0','repository':repo,'workflow_run_id':run['id'],'workflow_run_url':run['html_url'],'commit':run.get('head_sha',''),'failed_jobs':all_items}
          Path('report.md').write_text('\n'.join(out)+"\n\n```json\n"+json.dumps(payload,indent=2)+"\n```\n",encoding='utf-8')
          Path('ai-context.json').write_text(json.dumps(payload,separators=(',',':')),encoding='utf-8')
          PY
      - name: NVIDIA enhanced analysis
        if: ${{ env.NVIDIA_API_KEY != '' }}
        env:
          CI_DETECTIVE_AI_CONTEXT: ${{ github.workspace }}/ai-context.json
          CI_DETECTIVE_REPORT_FILE: ${{ github.workspace }}/report.md
        shell: bash
        run: python3 src/nvidia_ai.py
      - name: Upload central report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-detective-central-report-${{ github.run_id }}
          path: report.md
          if-no-files-found: warn
          retention-days: 14
