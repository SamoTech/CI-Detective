name: CI Detective Integration Test

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  intentional-failure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Emit representative failure
        shell: bash
        run: python tests/fixtures/ci_failure_fixture.py

  detect:
    if: ${{ failure() }}
    needs: intentional-failure
    permissions:
      contents: read
      actions: read
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run CI Detective against failed jobs
        uses: ./
