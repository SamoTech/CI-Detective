name: CI Detective Integration Test

on:
  push:
    paths:
      - "tests/fixtures/ci_failure_fixture.py"
      - "src/ci_detective.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  intentional-failure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Emit representative failure
        shell: bash
        run: python tests/fixtures/ci_failure_fixture.py

  detect:
    if: ${{ failure() }}
    needs: intentional-failure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run CI Detective against failed jobs
        uses: ./
