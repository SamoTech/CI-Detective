name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -q

  detect:
    name: CI Detective
    if: ${{ failure() }}
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: Run CI Detective
        uses: ./
        with:
          comment-on-pr: 'true'
