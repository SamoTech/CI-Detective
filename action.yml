name: CI Detective
description: Detect and explain common GitHub Actions CI failures with deterministic analysis and optional NVIDIA AI enhancement.
author: SamoTech
branding:
  icon: search
  color: blue

inputs:
  comment-on-pr:
    description: Post the diagnosis as a PR comment when applicable.
    required: false
    default: 'true'
  ai-analysis:
    description: Enable optional NVIDIA free-model AI analysis when NVIDIA_API_KEY is configured.
    required: false
    default: 'true'

outputs:
  diagnosis:
    description: Versioned JSON diagnosis payload containing all failed jobs.
    value: ${{ steps.detect.outputs.diagnosis }}
  confidence:
    description: Confidence of the primary diagnosis.
    value: ${{ steps.detect.outputs.confidence }}
  schema_version:
    description: Diagnosis JSON schema version.
    value: ${{ steps.detect.outputs.schema_version }}
  ai_diagnosis:
    description: Advisory NVIDIA AI analysis JSON payload, when available.
    value: ${{ steps.ai.outputs.ai_diagnosis }}
  ai_model:
    description: NVIDIA model selected after live availability checks.
    value: ${{ steps.ai.outputs.ai_model }}
  ai_status:
    description: NVIDIA AI status: success or unavailable.
    value: ${{ steps.ai.outputs.ai_status }}

runs:
  using: composite
  steps:
    - name: Run CI Detective
      id: detect
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        INPUT_COMMENT_ON_PR: ${{ inputs.comment-on-pr }}
      run: python3 "${{ github.action_path }}/src/ci_detective.py"
    - name: Run optional NVIDIA AI analysis
      id: ai
      if: ${{ inputs.ai-analysis == 'true' }}
      shell: bash
      env:
        NVIDIA_API_KEY: ${{ env.NVIDIA_API_KEY }}
        CI_DETECTIVE_AI_CONTEXT: ${{ steps.detect.outputs.diagnosis }}
      run: python3 "${{ github.action_path }}/src/nvidia_ai.py"
